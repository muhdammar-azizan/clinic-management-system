name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the older run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Style, static analysis and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Get the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Known vulnerabilities in PHP packages
        run: composer audit

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, fileinfo, mbstring
          coverage: pcov

      - name: Get the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: npm ci

      - name: Build the front end
        run: npm run build

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      # The tests use their own in-memory database (see phpunit.xml).
      # pipefail makes a failing test fail the step even though the output goes through tee.
      - name: Run all tests with coverage
        shell: bash
        run: php artisan test --coverage-text --coverage-clover=coverage.xml | tee coverage.txt

      - name: Show the coverage in the run summary
        if: always()
        run: |
          {
            echo '### Test coverage'
            echo '```'
            grep -E "Total|Cov|%" coverage.txt | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Saved quality report matches the document
        run: php artisan quality:document --check

      - name: Known vulnerabilities in JavaScript packages
        run: npm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt
          if-no-files-found: ignore

  # The app runs on MySQL when deployed, but the other job tests on SQLite.
  # This job runs the same tests on MySQL to find differences (search, dates, sorting).
  tests-mysql:
    name: Tests on MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: clinic_test
          MYSQL_USER: clinic
          MYSQL_PASSWORD: clinic
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: clinic_test
      DB_USERNAME: clinic
      DB_PASSWORD: clinic
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo, mbstring
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run all tests on MySQL
        run: php artisan test
