ServerName localhost
ServerTokens Prod
ServerSignature Off

# Several PHP worker processes, so users do not wait in one queue.
# Each worker uses roughly 30 to 60 MB, so keep MaxRequestWorkers within the memory of the plan.
<IfModule mpm_prefork_module>
    StartServers 4
    MinSpareServers 4
    MaxSpareServers 8
    MaxRequestWorkers 16
    MaxConnectionsPerChild 1000
</IfModule>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Never serve hidden files such as .env or .git.
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
