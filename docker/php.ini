; Production settings for the container.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M

; Medical record files: up to 5 prescription files and 5 attachments of 5 MB each.
upload_max_filesize = 6M
post_max_size = 55M
max_file_uploads = 12

; Compile each PHP file once. The files never change inside the container.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
